<header class="site-header"><div class="header-inner"><a class="brand" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a><p>{{ .Site.Params.description }}</p></div>
<nav class="site-nav" aria-label="メインメニュー">{{ $current := . }}{{ range .Site.Menus.main }}<a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}{{ if eq .Identifier "guides" }} data-analytics="topic"{{ end }}{{ if eq .Identifier "works" }} data-analytics="consultation"{{ end }}>{{ .Name }}</a>{{ end }}</nav></header>
