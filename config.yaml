baseURL: https://sonohen.github.io/
languageCode: ja-JP
title: sonohen's tech blog
theme: stack
defaultContentLanguage: ja
hasCJKLanguage: true
pagination:
  pagerSize: 10

menus:
  main:
    - identifier: home
      name: ホーム
      pageRef: /
      weight: 10
    - identifier: guides
      name: テーマ別ガイド
      pageRef: /guides
      weight: 20
    - identifier: works
      name: 実績・相談
      pageRef: /page/works
      weight: 30
    - identifier: about
      name: About
      pageRef: /page/about
      weight: 40
    - identifier: search
      name: 検索
      pageRef: /page/search
      weight: 50
  footer:
    - name: アーカイブ
      pageRef: /page/archives
      weight: 10
    - name: プライバシーポリシー
      pageRef: /page/privacy
      weight: 20

params:
  colorScheme:
    default: light
    toggle: false
  analytics:
    enabled: true
    measurementID: G-L48N0BM9MP
  mainSections:
    - posts
  description: AI・クラウド・日々の道具を、実際に使って考えるブログ
  footer:
    since: 2020
  article:
    toc: true
    license:
      enabled: true
      default: Licensed under CC BY-NC-SA 4.0
  sidebar:
    sticky: true
    subtitle: AI・クラウド・日々の道具を、実際に使って考えるブログ
    avatar: img/avatar.png
  search:
    enabled: true
  widgets:
    homepage:
      - type: search
      - type: archives
      - type: categories
      - type: tag-cloud
    page:
      - type: toc
  comments:
    enabled: false
  favicon: /favicon.ico
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/sonohen/
      params:
        icon: brand-github
    - identifier: twitter
      name: Twitter
      url: https://twitter.com/sonohenv0/
      params:
        icon: brand-twitter
  opengraph:
    enabled: true
    src: /img/avatar.png
    local: true

related:
  threshold: 80
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 50
    - name: date
      weight: 10
